<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso — TCCON Orçamentos</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#211f1b;background:#e9e5dd}
    .page{min-height:100vh;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
    .brand{position:relative;overflow:hidden;background:linear-gradient(150deg,#26241f,#2f2c26 55%,#3a352d);color:#f3efe8;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
    .orb{position:absolute;right:-90px;top:-70px;width:340px;height:340px;border-radius:50%;background:#2f5d86;opacity:.18;filter:blur(8px)}
    .mark{position:relative;width:76px;height:76px;border-radius:18px;background:#2f5d86;display:grid;place-items:center;font-size:25px;font-weight:800;letter-spacing:1px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
    .title{position:relative;font-size:40px;line-height:1.05;font-weight:800}
    .title p{font-size:15px;line-height:1.6;font-weight:400;color:#b3ada2;max-width:340px;margin:16px 0 0}
    .foot{position:relative;font-size:11.5px;color:#7a746a}
    .access{background:radial-gradient(circle at 70% 15%,#f3eee5,#e6e0d5);display:flex;align-items:center;justify-content:center;padding:48px 44px}
    .card{width:100%;max-width:420px;background:#fff;border:1px solid #ded7cb;border-radius:18px;padding:34px;box-shadow:0 18px 45px rgba(40,35,28,.1)}
    h1{font-size:27px;margin:0 0 5px}
    .intro{font-size:13.5px;color:#8a8377;margin:0 0 24px;line-height:1.5}
    label{display:block;font-size:12px;font-weight:700;color:#686157;margin:0 0 6px}
    input{width:100%;height:44px;border:1px solid #d8d1c5;border-radius:9px;padding:0 12px;font-size:14px;background:#fff;margin-bottom:16px}
    input:focus{outline:2px solid #2f5d86;outline-offset:-1px}
    button{width:100%;height:46px;margin-top:4px;border:0;border-radius:9px;background:#2f5d86;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #error{display:none;margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#f9e9e7;color:#9a3f35;font-size:13px}
    #notice{display:none;margin:0 0 12px;padding:10px 12px;border-radius:8px;background:#e7f3eb;color:#2f6b45;font-size:13px;line-height:1.45}
    .password-wrap{position:relative;margin-bottom:8px}
    .password-wrap input{margin-bottom:0;padding-right:48px}
    #toggle-senha{position:absolute;right:4px;top:4px;width:36px;height:36px;margin:0;padding:8px;border-radius:7px;background:transparent;color:#686157;display:grid;place-items:center}
    #toggle-senha:hover{background:#f0ece5;color:#2f5d86}
    #toggle-senha svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #redefinir{height:auto;margin:0 0 16px;padding:6px 2px;background:transparent;color:#2f5d86;text-align:right;font-size:13px;font-weight:700}
    #redefinir:hover{text-decoration:underline}
    .modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(23,21,18,.62);padding:20px;align-items:center;justify-content:center}
    .modal.open{display:flex}
    .modal-card{width:100%;max-width:440px;background:#fff;border-radius:16px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
    .modal-card h2{margin:0 0 8px;font-size:22px}.modal-card p{color:#777065;font-size:13.5px;line-height:1.5}
    .modal-actions{display:flex;gap:10px}.modal-actions button{margin:0}.modal-actions .cancel{background:#eee9e1;color:#514b43}
    @media(max-width:760px){.page{grid-template-columns:1fr}.brand{min-height:250px;padding:30px 24px}.access{padding:30px 18px}.card{padding:28px 22px}.title{font-size:34px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="brand" aria-label="TCCON Orçamentos">
      <div class="orb"></div>
      <div class="mark">TC</div>
      <div class="title">Sistema de<br>Orçamentos
        <p>Acesso seguro ao ambiente comercial TCCON.</p>
      </div>
      <div class="foot">TCCON Artefatos de Concreto</div>
    </section>
    <section class="access">
      <form class="card" id="login-form">
        <h1>Acesso ao sistema</h1>
        <p class="intro">Informe suas credenciais para visualizar os usuários dos orçamentos.</p>
        <div id="error" role="alert"></div>
        <div id="notice" role="status"></div>
        <label for="usuario">USUÁRIO</label>
        <input id="usuario" name="usuario" autocomplete="username" required placeholder="Digite seu usuário">
        <label for="senha">SENHA</label>
        <div class="password-wrap">
          <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="Digite sua senha">
          <button id="toggle-senha" type="button" aria-label="Mostrar senha" title="Mostrar senha">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>
          </button>
        </div>
        <button id="redefinir" type="button">Esqueci minha senha</button>
        <button id="entrar" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  <div class="modal" id="reset-modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <div class="modal-card">
      <h2 id="reset-title">Solicitar redefinição</h2>
      <p>O link seguro será enviado exclusivamente ao financeiro da TCCON.</p>
      <div id="reset-error" role="alert"></div>
      <label for="reset-email">E-MAIL AUTORIZADO</label>
      <input id="reset-email" type="email" value="financeiro@tccon.com.br" readonly>
      <div class="modal-actions">
        <button class="cancel" id="cancelar-reset" type="button">Cancelar</button>
        <button id="enviar-reset" type="button">Enviar link</button>
      </div>
    </div>
  </div>
  <script>
    const form=document.getElementById('login-form');
    const errorBox=document.getElementById('error');
    const noticeBox=document.getElementById('notice');
    const button=document.getElementById('entrar');
    const resetButton=document.getElementById('redefinir');
    const passwordInput=document.getElementById('senha');
    const passwordToggle=document.getElementById('toggle-senha');
    const resetModal=document.getElementById('reset-modal');
    const sendResetButton=document.getElementById('enviar-reset');
    const resetError=document.getElementById('reset-error');

    passwordToggle.addEventListener('click',()=>{
      const visible=passwordInput.type==='text';
      passwordInput.type=visible?'password':'text';
      const label=visible?'Mostrar senha':'Ocultar senha';
      passwordToggle.setAttribute('aria-label',label);
      passwordToggle.setAttribute('title',label);
      passwordInput.focus();
    });

    resetButton.addEventListener('click',()=>{
      errorBox.style.display='none';
      noticeBox.style.display='none';
      resetError.textContent='';
      resetModal.classList.add('open');
      sendResetButton.focus();
    });
    document.getElementById('cancelar-reset').addEventListener('click',()=>resetModal.classList.remove('open'));
    sendResetButton.addEventListener('click',async()=>{
      sendResetButton.disabled=true;
      sendResetButton.textContent='Enviando...';
      try{
        const response=await fetch('/api/gate/reset',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email:'financeiro@tccon.com.br'})
        });
        if(response.ok){
          resetModal.classList.remove('open');
          noticeBox.textContent='Link de redefinição enviado para financeiro@tccon.com.br.';
          noticeBox.style.display='block';
        }else{
          resetError.textContent=response.status===429
            ?'Muitas solicitações. Aguarde alguns minutos.'
            :'Não foi possível enviar agora. Entre em contato com financeiro@tccon.com.br.';
        }
      }catch{
        resetError.textContent='Não foi possível conectar ao servidor.';
      }
      sendResetButton.disabled=false;
      sendResetButton.textContent='Enviar link';
    });

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      errorBox.style.display='none';
      noticeBox.style.display='none';
      button.disabled=true;
      button.textContent='Entrando...';
      try{
        const response=await fetch('/api/gate/login',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({usuario:form.usuario.value.trim(),senha:form.senha.value})
        });
        if(response.ok){location.replace('/');return;}
        errorBox.textContent=response.status===429?'Muitas tentativas. Aguarde alguns minutos.':'Usuário ou senha incorretos.';
      }catch{
        errorBox.textContent='Não foi possível conectar ao servidor.';
      }
      form.senha.value='';
      errorBox.style.display='block';
      button.disabled=false;
      button.textContent='Entrar';
    });
  </script>
</body>
</html>
