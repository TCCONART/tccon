<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Redefinir senha — TCCON</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:radial-gradient(circle at 70% 15%,#f3eee5,#dcd5c9);color:#211f1b}
    .card{width:100%;max-width:440px;background:#fff;border:1px solid #ded7cb;border-radius:18px;padding:34px;box-shadow:0 18px 45px rgba(40,35,28,.12)}
    h1{margin:0 0 8px;font-size:26px}p{color:#777065;font-size:13.5px;line-height:1.5}label{display:block;font-size:12px;font-weight:700;margin:18px 0 6px}
    .wrap{position:relative}.wrap input{padding-right:48px}input{width:100%;height:44px;border:1px solid #d8d1c5;border-radius:9px;padding:0 12px;font-size:14px}
    .eye{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:transparent;font-size:18px;cursor:pointer}
    .submit{width:100%;height:46px;margin-top:22px;border:0;border-radius:9px;background:#2f5d86;color:#fff;font-weight:700;cursor:pointer}
    .message{display:none;margin-top:16px;padding:11px;border-radius:8px;font-size:13px}.error{background:#f9e9e7;color:#9a3f35}.success{background:#e7f3eb;color:#2f6b45}
  </style>
</head>
<body>
  <form class="card" id="reset-form">
    <h1>Definir nova senha</h1>
    <p>Crie uma senha com pelo menos 10 caracteres. A alteração entra em vigor imediatamente.</p>
    <label for="nova-senha">NOVA SENHA</label>
    <div class="wrap"><input id="nova-senha" type="password" minlength="10" maxlength="256" required autocomplete="new-password"><button class="eye" type="button" aria-label="Mostrar nova senha">👁</button></div>
    <label for="confirmar-senha">CONFIRMAR SENHA</label>
    <input id="confirmar-senha" type="password" minlength="10" maxlength="256" required autocomplete="new-password">
    <button class="submit" type="submit">Redefinir senha</button>
    <div id="message" class="message" role="status"></div>
  </form>
  <script>
    const form=document.getElementById('reset-form'),message=document.getElementById('message'),password=document.getElementById('nova-senha'),confirmation=document.getElementById('confirmar-senha');
    document.querySelector('.eye').addEventListener('click',event=>{const show=password.type==='password';password.type=show?'text':'password';event.currentTarget.setAttribute('aria-label',show?'Ocultar nova senha':'Mostrar nova senha')});
    form.addEventListener('submit',async event=>{
      event.preventDefault();message.style.display='none';
      if(password.value!==confirmation.value){message.textContent='As senhas não coincidem.';message.className='message error';message.style.display='block';return}
      const token=new URLSearchParams(location.search).get('token')||'';
      const button=form.querySelector('.submit');button.disabled=true;button.textContent='Redefinindo...';
      try{
        const response=await fetch('/api/gate/reset/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,senha:password.value})});
        if(!response.ok)throw new Error();
        message.textContent='Senha redefinida. Você será direcionado para o acesso.';message.className='message success';message.style.display='block';
        form.reset();setTimeout(()=>location.replace('/'),1800);return;
      }catch{message.textContent='Link inválido, expirado ou já utilizado.';message.className='message error';message.style.display='block'}
      button.disabled=false;button.textContent='Redefinir senha';
    });
  </script>
</body>
</html>
