services:
  tccon:
    build: .
    container_name: tccon-orcamentos
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${TCCON_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      PUBLIC_DIR: /app/public
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-20971520}
      MAX_STORE_BYTES: ${MAX_STORE_BYTES:-52428800}
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: ${TCCON_MEMORY_LIMIT:-512m}
    cpus: ${TCCON_CPU_LIMIT:-1.0}
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: ${TCCON_LOG_MAX_SIZE:-10m}
        max-file: ${TCCON_LOG_MAX_FILES:-5}
