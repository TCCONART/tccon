# Crie /etc/nginx/tccon.htpasswd antes de habilitar este arquivo.
# Substitua apenas o server_name; não exponha a porta 3000 publicamente.
limit_req_zone $binary_remote_addr zone=tccon_auth:10m rate=10r/m;

upstream tccon_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name orcamentos.seudominio.com.br;
    server_tokens off;

    client_max_body_size 20m;

    # Barreira externa obrigatória enquanto a aplicação não tiver sessões e
    # autorização próprias. Gere o arquivo conforme a documentação operacional.
    auth_basic "TCCON";
    auth_basic_user_file /etc/nginx/tccon.htpasswd;
    auth_delay 500ms;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/auth/ {
        limit_req zone=tccon_auth burst=5 nodelay;
        proxy_pass http://tccon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://tccon_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
